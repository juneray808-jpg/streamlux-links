name: Playback Lab — Build Android APK

on:
  push:
    branches:
      - main
    paths:
      - "playback-lab/**"
      - ".github/workflows/playback-lab-build-apk.yml"
  pull_request:
    branches:
      - main
    paths:
      - "playback-lab/**"
      - ".github/workflows/playback-lab-build-apk.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: playback-lab

jobs:
  build-apk:
    name: Build standalone APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Print revision
        run: |
          echo "HEAD=$(git rev-parse HEAD)"
          git log -1 --oneline

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: playback-lab/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Export ANDROID_HOME
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            echo "Android SDK not found"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

      - name: Install Android NDK (retry)
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER=$(find "$SDK/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)
          NDK_PKG="ndk;27.1.12297006"
          for attempt in 1 2 3 4; do
            echo "NDK install attempt ${attempt}/4..."
            rm -rf "$SDK/.temp" "$SDK/ndk/27.1.12297006" 2>/dev/null || true
            if yes | "$SDKMANAGER" --install "$NDK_PKG"; then
              echo "NDK installed"
              exit 0
            fi
            sleep $((attempt * 5))
          done
          exit 1

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-playback-lab-gradle-${{ hashFiles('playback-lab/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playback-lab-gradle-

      - name: Install JS dependencies
        run: npm ci

      - name: Configure Supabase env for release bundle
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$EXPO_PUBLIC_SUPABASE_URL" ] || [ -z "$EXPO_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "::warning::Missing EXPO_PUBLIC_SUPABASE_URL or EXPO_PUBLIC_SUPABASE_ANON_KEY repo secrets."
            echo "::warning::APK will build but feed will show 'Supabase not configured'."
          else
            printf '%s\n' \
              "EXPO_PUBLIC_SUPABASE_URL=$EXPO_PUBLIC_SUPABASE_URL" \
              "EXPO_PUBLIC_SUPABASE_ANON_KEY=$EXPO_PUBLIC_SUPABASE_ANON_KEY" \
              > .env
            echo "Wrote .env for release bundle (keys not printed)."
          fi

      - name: Expo prebuild (Android)
        env:
          CI: "1"
          PLAYBACK_LAB_STANDALONE_BUILD: "1"
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          npx expo prebuild --platform android --no-install --clean
          test -f android/gradlew

      - name: Gradle executable
        run: chmod +x android/gradlew

      - name: Write android/local.properties
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          printf 'sdk.dir=%s\n' "$SDK" > android/local.properties

      - name: Tune Gradle for CI
        run: |
          # Ensure trailing newline before append (prebuild file may omit final \n).
          tail -c1 android/gradle.properties | od -An -t x1 | grep -q '0a' || echo >> android/gradle.properties
          {
            echo "org.gradle.warning.mode=none"
            echo "org.gradle.parallel=true"
            echo "org.gradle.caching=true"
            echo "org.gradle.workers.max=2"
            echo "org.gradle.daemon=false"
          } >> android/gradle.properties
          echo "--- gradle.properties tail ---"
          tail -n 8 android/gradle.properties

      - name: Build release APK
        env:
          GRADLE_OPTS: "-Xmx4096m -XX:MaxMetaspaceSize=768m -Dorg.gradle.workers.max=2"
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          PLAYBACK_LAB_STANDALONE_BUILD: "1"
        run: |
          cd android
          ./gradlew assembleRelease \
            -PreactNativeArchitectures=arm64-v8a \
            --no-daemon \
            --build-cache \
            -x lint \
            -x test \
            2>&1 | tee ../build.log
          test -f app/build/outputs/apk/release/app-release.apk

      - name: Package artifact
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/release/app-release.apk output/Playback-Lab.apk
          ls -lh output/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Playback-Lab-APK
          path: playback-lab/output/Playback-Lab.apk
          retention-days: 30
          if-no-files-found: error

      - name: Done
        run: |
          echo "Download APK: Actions → this workflow run → Artifacts → Playback-Lab-APK"
