name: Playback Lab CI

on:
  push:
    branches:
      - main
    paths:
      - "playback-lab/**"
      - ".github/workflows/playback-lab-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "playback-lab/**"
      - ".github/workflows/playback-lab-ci.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: playback-lab

jobs:
  verify:
    name: Typecheck & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: playback-lab/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit
