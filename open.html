<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Opening StreamLux…</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:radial-gradient(circle at 50% 25%, #2a1758 0%, #0c0a1a 60%, #050409 100%); color:#fff; text-align:center; padding:24px; }
  .wrap { max-width:420px; }
  .logo { font-size:30px; font-weight:800;
    background:linear-gradient(90deg,#9b5cf6,#0cf0f6); -webkit-background-clip:text; background-clip:text; color:transparent; }
  p { color:#b9b3d6; line-height:1.5; margin:12px 0 26px; }
  .btn { display:inline-block; padding:13px 24px; border-radius:999px; font-weight:700; text-decoration:none; margin:6px; }
  .primary { background:linear-gradient(90deg,#9b5cf6,#0cf0f6); color:#0c0a1a; }
  .ghost { border:1px solid #4a3d7a; color:#cfc8ee; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="logo">StreamLux</div>
    <p id="msg">Opening in the StreamLux app…</p>
    <a id="openBtn" class="btn primary" href="#">Open in StreamLux</a>
    <a class="btn ghost" href="https://play.google.com/store/apps/details?id=com.terry.streamlux.io">Get the app</a>
  </div>
<script>
  (function () {
    var parts = window.location.pathname.split('/').filter(Boolean);
    var type = parts[0] || '';
    var id = parts[1] || '';
    var deep = id ? ('streamlux://' + type + '/' + id) : 'streamlux://';
    document.getElementById('openBtn').setAttribute('href', deep);
    // Try to hand off to the app (works when installed but link wasn't auto-verified).
    setTimeout(function () { window.location.href = deep; }, 400);
  })();
</script>
</body>
</html>
