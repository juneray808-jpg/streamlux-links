<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Opening StreamLux…</title>
<link rel="stylesheet" href="/css/site.css" />
<style>
  body { display:flex; align-items:center; justify-content:center; text-align:center; padding:24px; }
  .open-wrap { max-width:420px; }
</style>
</head>
<body>
  <div class="open-wrap">
    <div class="wordmark lg">StreamLux</div>
    <p id="msg" class="muted">Opening in the StreamLux app…</p>
    <a id="openBtn" class="btn btn-primary" href="#">Open in StreamLux</a>
    <a class="btn btn-ghost" href="https://play.google.com/store/apps/details?id=com.terry.streamlux.io">Get the app</a>
  </div>
<script>
  (function () {
    var parts = window.location.pathname.split('/').filter(Boolean);
    var type = parts[0] || '';
    var id = parts[1] || '';
    var deep = id ? ('streamlux://' + type + '/' + id) : 'streamlux://';
    document.getElementById('openBtn').setAttribute('href', deep);
    setTimeout(function () { window.location.href = deep; }, 400);
  })();
</script>
</body>
</html>
