<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>StreamLux</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:radial-gradient(circle at 50% 25%, #2a1758 0%, #0c0a1a 60%, #050409 100%); color:#fff; text-align:center; padding:24px; }
  .wrap { max-width:420px; }
  .logo { font-size:34px; font-weight:800; letter-spacing:.5px;
    background:linear-gradient(90deg,#9b5cf6,#0cf0f6); -webkit-background-clip:text; background-clip:text; color:transparent; }
  p { color:#b9b3d6; line-height:1.5; margin:14px 0 28px; }
  .btn { display:inline-block; padding:14px 26px; border-radius:999px; font-weight:700; text-decoration:none;
    background:linear-gradient(90deg,#9b5cf6,#0cf0f6); color:#0c0a1a; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="logo">StreamLux</div>
    <p>Watch, match, and go live. Get the app to start streaming.</p>
    <a class="btn" href="https://play.google.com/store/apps/details?id=com.terry.streamlux.io">Get StreamLux</a>
  </div>
</body>
</html>
